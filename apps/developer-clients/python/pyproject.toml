[project]
name = "fatecat-client"
version = "0.1.0"
description = "Dependency-free Python client for the FateCat public HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TradeCat Labs" }]
keywords = ["fatecat", "api-client", "agent-infrastructure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatecat_client"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/fatecat_client",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
exclude = ["/.gitignore", "/AGENTS.md"]
