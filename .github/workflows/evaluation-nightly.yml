name: FateCat Evaluation Nightly

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Per-command timeout for EvaluationRun commands"
        required: false
        default: "900"
        type: string
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

jobs:
  evaluation-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Bootstrap runtime
        run: bash scripts/bootstrap.sh --with-dev

      - name: Run evaluation nightly
        run: |
          timeout_seconds="${{ github.event.inputs.timeout_seconds || '900' }}"
          bash scripts/evaluation-nightly.sh \
            --timeout-seconds "${timeout_seconds}" \
            --output-dir /tmp/fatecat-evaluation-nightly \
            --history-dir /tmp/fatecat-evaluation-history

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatecat-evaluation-nightly
          path: |
            /tmp/fatecat-evaluation-nightly
            /tmp/fatecat-evaluation-history
          if-no-files-found: warn
