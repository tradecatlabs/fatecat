name: FateCat Quick CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatecat-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Run quick gate
        env:
          RUFF_CACHE_DIR: /tmp/fatecat-ruff-cache
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/local-ci.sh --profile quick --with-dev --output /tmp/fatecat-ci-quick

      - name: Upload quick evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fatecat-quick-${{ github.sha }}
          path: |
            /tmp/fatecat-ci-quick/summary.json
            /tmp/fatecat-ci-quick/summary.txt
          if-no-files-found: warn
          retention-days: 14
